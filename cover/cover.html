<!doctype html><html><head><meta charset="utf-8">
<!-- DEV cover image: 1000x420, drawn at 2x. Render: firefox --headless --window-size=2000,840 --screenshot cover.png cover.html -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
 :root { --bg:#f7f1e8; --card:#fffdf9; --ink:#2d2620; --muted:#7a6e62; --accent:#c4532d; --herb:#4f7a45; --herb-soft:#e5efdf; }
 html,body { margin:0; width:2000px; height:840px; overflow:hidden; background:var(--bg); }
 .wrap { position:relative; width:2000px; height:840px; }
 svg.bg { position:absolute; inset:0; } svg.top { pointer-events:none; }

 .txt { position:absolute; left:110px; top:120px; width:900px; font-family:Inter,sans-serif; color:var(--ink); }
 .kick { font-size:28px; letter-spacing:.14em; text-transform:uppercase; color:var(--herb); font-weight:700; }
 h1 { font-family:Fraunces,Georgia,serif; font-size:150px; line-height:1; margin:26px 0 30px; font-weight:800; letter-spacing:-.02em; }
 h1 span { color:var(--accent); }
 p { font-size:42px; line-height:1.3; margin:0; color:#4a4038; max-width:860px; }
 p b { color:var(--ink); }
 .chips { position:absolute; left:110px; bottom:84px; display:flex; gap:16px; font-family:Inter,sans-serif; }
 .chip { font-size:26px; font-weight:600; color:var(--herb); background:var(--herb-soft); border-radius:999px; padding:10px 24px; }
 .chip.un { color:#fff; background:#2b6ea3; }

 .ph { position:absolute; background:var(--card); padding:14px 14px 58px; border-radius:10px;
       box-shadow:0 2px 4px rgba(60,40,20,.08), 0 18px 40px rgba(60,40,20,.18); }
 .ph img { display:block; width:100%; height:100%; object-fit:cover; border-radius:4px; }
 .ph .cap { position:absolute; left:0; right:0; bottom:12px; text-align:center;
            font-family:Fraunces,Georgia,serif; font-size:30px; font-weight:700; color:var(--ink); }
 .fridge { left:1050px; top:40px;  width:300px; height:370px; transform:rotate(-5deg); }
 .chipsp { left:1070px; top:520px; width:370px; height:200px; transform:rotate(3deg); }
 .soup   { left:1490px; top:130px; width:430px; height:430px; transform:rotate(2.5deg); }
</style></head><body><div class="wrap">



<svg class="bg" width="2000" height="840" viewBox="0 0 2000 840">
 <defs><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="2" fill="#c4532d" fill-opacity=".10"/></pattern></defs>
 <rect x="1000" y="0" width="1000" height="840" fill="url(#dots)"/>
 <!-- the path from fridge to fork -->
</svg>

<div class="txt">
 <div class="kick">Open-source AI · runs on my laptop</div>
 <h1>Fridge<span>2</span>Fork</h1>
 <p>From fridge to fork,<br><b>before it goes in the bin.</b></p>
</div>
<div class="chips"><span class="chip">gemma3</span><span class="chip">Ollama</span><span class="chip">offline &amp; free</span><span class="chip un">UN SDG 12.3</span></div>

<div class="ph fridge"><img src="fridge.jpg" alt=""><div class="cap">what was left</div></div>
<div class="ph chipsp"><img src="chips.jpg" alt=""><div class="cap">+ leftover chips</div></div>
<div class="ph soup"><img src="soup.jpg" alt=""><div class="cap">dinner, sorted</div></div>

<svg class="bg top" width="2000" height="840" viewBox="0 0 2000 840">
 <!-- ingredients -> soup -->
 <path d="M1375,150 C1410,70 1520,60 1590,118" fill="none" stroke="#c4532d" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
 <path d="M1578,96 L1596,122 L1566,126" fill="none" stroke="#c4532d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- leftovers -> chips on the side -->
 <path d="M1462,630 C1500,690 1560,690 1600,640" fill="none" stroke="#c4532d" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
 <path d="M1584,646 L1604,636 L1606,660" fill="none" stroke="#c4532d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div></body></html>
